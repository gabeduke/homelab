#
# Provider Selection Page - Allows users to choose between Google and Facebook
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-selector-nginx
  namespace: kube-system
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        upstream google-auth {
            server traefik-forward-auth-google:4181;
        }
        
        upstream facebook-auth {
            server traefik-forward-auth-facebook:4181;
        }
        
        server {
            listen 80;
            server_name _;
            
            # Proxy Google OAuth requests
            location /_oauth/google {
                rewrite ^/_oauth/google(.*)$ /_oauth$1 break;
                proxy_pass http://google-auth;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Proxy Facebook OAuth requests
            location /_oauth/facebook {
                rewrite ^/_oauth/facebook(.*)$ /_oauth$1 break;
                proxy_pass http://facebook-auth;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Proxy all /_oauth requests to Google (default) - handles OAuth callbacks
            location /_oauth {
                proxy_pass http://google-auth;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Serve selection page only at /select
            location = /select {
                root /usr/share/nginx/html;
                try_files /index.html =404;
            }
            
            # All other requests (forwardAuth protocol) proxy to Google instance
            location / {
                proxy_pass http://google-auth;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-selector-html
  namespace: kube-system
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign In - Choose Provider</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            .container {
                background: white;
                border-radius: 12px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                padding: 40px;
                max-width: 400px;
                width: 100%;
                text-align: center;
            }
            h1 {
                color: #333;
                margin-bottom: 10px;
                font-size: 28px;
            }
            p {
                color: #666;
                margin-bottom: 30px;
                font-size: 16px;
            }
            .provider-buttons {
                display: flex;
                flex-direction: column;
                gap: 15px;
            }
            .provider-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 14px 24px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                background: white;
                color: #333;
                text-decoration: none;
                font-size: 16px;
                font-weight: 500;
                transition: all 0.3s ease;
                cursor: pointer;
            }
            .provider-btn:hover {
                border-color: #667eea;
                background: #f8f9ff;
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            }
            .provider-btn.google {
                border-color: #4285f4;
            }
            .provider-btn.google:hover {
                background: #f0f7ff;
                border-color: #4285f4;
            }
            .provider-btn.facebook {
                border-color: #1877f2;
            }
            .provider-btn.facebook:hover {
                background: #f0f4ff;
                border-color: #1877f2;
            }
            .provider-icon {
                width: 24px;
                height: 24px;
                margin-right: 12px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Sign In</h1>
            <p>Choose your preferred sign-in method</p>
            <div class="provider-buttons">
                <a href="/_oauth/google" class="provider-btn google">
                    <svg class="provider-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Sign in with Google
                </a>
                <a href="/_oauth/facebook" class="provider-btn facebook">
                    <svg class="provider-icon" viewBox="0 0 24 24" fill="#1877F2" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                    Sign in with Facebook
                </a>
            </div>
        </div>
    </body>
    </html>

---
#
# Nginx Deployment to serve the selection page and proxy OAuth requests
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-selector
  namespace: kube-system
  labels:
    app: auth-selector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-selector
  template:
    metadata:
      labels:
        app: auth-selector
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: html
          configMap:
            name: auth-selector-html
        - name: nginx-config
          configMap:
            name: auth-selector-nginx

---
#
# Service for auth selector
#
apiVersion: v1
kind: Service
metadata:
  name: auth-selector
  namespace: kube-system
  labels:
    app: auth-selector
spec:
  type: ClusterIP
  selector:
    app: auth-selector
  ports:
    - port: 80
      targetPort: 80

---
#
# Ingress for auth selector (bypasses auth to show selection page)
# Note: This ingress should be accessible without auth middleware
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-selector
  namespace: kube-system
  annotations:
    kubernetes.io/ingress.class: traefik
    ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-aws-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.leetserve.com
      secretName: auth-selector-tls
  rules:
    - host: auth.leetserve.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-selector
                port:
                  number: 80

