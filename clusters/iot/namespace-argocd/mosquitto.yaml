apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mosquitto
  namespace: argocd
spec:
  destination:
    namespace: mosquitto
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: mosquitto
    repoURL: https://k8s-at-home.com/charts/
    targetRevision: 4.4.0
    helm:
      values: |-
        # NOTE: `persistence` is a MAP of named volumes, each with its own
        # `enabled` key. Do NOT add a top-level `persistence.enabled` — the
        # chart does `range $index, $PVC := .Values.persistence`, so a bool at
        # the top level breaks rendering for the whole Application with:
        #   _pvc.tpl:7:19: executing "common.pvc" at <$PVC.enabled>:
        #   can't evaluate field enabled in type interface {}
        # That bug silently blocked every sync of this app from 2025-09-21
        # until 2026-09-07, which is how the mosquitto-data PVC went missing.
        persistence:
          data:
            enabled: true
            accessMode: ReadWriteOnce
            size: 1Gi
            # Pinned deliberately: the cluster currently has TWO default
            # StorageClasses (local-path and longhorn), so an unset
            # storageClass is resolved arbitrarily. local-path would also pin
            # the broker's data to a single node.
            storageClass: longhorn
        # NOTE: chart 4.4.0 generates mosquitto.conf itself, from auth /
        # persistence / perListenerSettings (see templates/configmap.yaml).
        # There is no top-level `config:` value — one was set here between
        # 2025-11-28 and 2026-09-07 and was silently ignored the whole time.
        # Custom conf requires overriding persistence."mosquitto-config" to
        # point at a ConfigMap of your own.
        service:
          main:
            type:
              LoadBalancer
            annotations:
              external-dns.alpha.kubernetes.io/hostname: mqtt.leetserve.com
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
