apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: longhorn-system
    server: https://kubernetes.default.svc
  source:
    repoURL: 'https://charts.longhorn.io'
    targetRevision: "1.6.2"
    chart: longhorn
    helm:
      values: |-
        ## The preUpgradeChecker should be disabled on bootstrap and then enabled after the initial install
        # preUpgradeChecker:
        #   jobEnabled: false
        defaultSettings:
          taintToleration: node-role.kubernetes.io/master=true:NoSchedule
        global:
          tolerations:
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: "NoSchedule"
            - key: "node-role.leetserve.com/mothership"
              operator: "Exists"
              effect: "NoSchedule"
        longhornManager:
          tolerations:
            - key: "node-role.kubernetes.io/master"
              operator: "Exists"
              effect: "NoSchedule"
            - key: "node-role.leetserve.com/mothership"
              operator: "Exists"
              effect: "NoSchedule"
        longhornUI:
          tolerations:
            - key: "node-role.kubernetes.io/master"
              operator: "Exists"
              effect: "NoSchedule"
            - key: "node-role.leetserve.com/mothership"
              operator: "Exists"
              effect: "NoSchedule"
        longhornDriver:
          tolerations:
            - key: "node-role.kubernetes.io/master"
              operator: "Exists"
              effect: "NoSchedule"
            - key: "node-role.leetserve.com/mothership"
              operator: "Exists"
              effect: "NoSchedule"
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            kubernetes.io/ingress.class: traefik
            ingress.kubernetes.io/ssl-redirect: "true"
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-traefik-forward-auth@kubernetescrd
          host: longhorn.leetserve.com
          tls: true
          tlsSecret: longhorn-tls
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
