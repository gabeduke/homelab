apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: "1.21.1"
    helm:
      values: |-
        crds:
          enabled: true
          keep: true
        prometheus:
          enabled: false
        global:
          leaderElection:
            namespace: cert-manager
        podDnsConfig:
          nameservers:
            - 8.8.8.8
            - 8.8.4.4
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
