apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prom-stack
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "46.4.1"  # Check for updates: helm search repo prometheus-community/kube-prometheus-stack --versions
    helm:
      values: |-
        kube-state-metrics:
          image:
            registry: docker.io
            repository: dukeman/kube-state-metrics
            tag: v2.9.2
          # Resource limits for kube-state-metrics
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
        prometheusOperator:
          admissionWebhooks:
            certManager:
              enabled: true
          # Resource limits for Prometheus Operator
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
        prometheus:
          prometheusSpec:
            retention: 7d  # Reduced from default 10d to save space
            retentionSize: 5GiB  # Hard limit on disk usage (must end with B)
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi
            # Resource limits for Prometheus (critical for Raspberry Pi)
            resources:
              requests:
                memory: 512Mi
                cpu: 200m
              limits:
                memory: 2Gi  # Prometheus can be memory-hungry, but cap it
                cpu: 1000m
            # Alerting configuration
            alerting:
              alertmanagers:
                - namespace: monitoring
                  name: prom-stack-kube-prometheus-alertmanager
                  port: http-web
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              kubernetes.io/ingress.class: traefik
              ingress.kubernetes.io/ssl-redirect: "true"
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-traefik-forward-auth@kubernetescrd
            hosts:
              - prometheus.leetserve.com
            paths:
              - /
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.leetserve.com
        alertmanager:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              kubernetes.io/ingress.class: traefik
              ingress.kubernetes.io/ssl-redirect: "true"
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-traefik-forward-auth@kubernetescrd
            hosts:
              - alertmanager.leetserve.com
            paths:
              - /
            tls:
              - secretName: alertmanager-tls
                hosts:
                  - alertmanager.leetserve.com
          alertmanagerSpec:
            retention: 120h  # 5 days - keep alerts for investigation
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 1Gi  # AlertManager needs less storage
            # Resource limits for AlertManager
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 128Mi
                cpu: 100m
            # Alert routing is configured via AlertmanagerConfig CRD
            # See: clusters/iot/namespace-monitoring/alertmanager-config.yaml
            # This allows better secret management and configuration
        prometheus-node-exporter:
          tolerations:
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.leetserve.com/mothership"
            operator: "Exists"
            effect: "NoSchedule"
        installCRDs: false
        grafana:
          admin:
            existingSecret: grafana-credentials
          rbac:
            pspEnabled: false
          # Resource limits for Grafana
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          plugins: []
          datasources:
            enabled: true
            label: grafana_datasource
            searchNamespace: ALL
            uid: prometheus
            url: http://prom-stack-kube-prometheus-prometheus.monitoring.svc:9090
          sidecar:
            datasources:
              enabled: true
              label: grafana_datasource
              searchNamespace: ALL
              uid: prometheus
              url: http://prom-stack-kube-prometheus-prometheus.monitoring.svc:9090
            dashboards:
              enabled: true
              label: grafana_dashboard
              searchNamespace: ALL
            notifiers:
              enabled: true
              label: grafana_notifiers
              searchNamespace: ALL
          service:
            annotations:
              external-dns.alpha.kubernetes.io/hostname: grafana.leetserve.com
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              kubernetes.io/ingress.class: traefik
              ingress.kubernetes.io/ssl-redirect: "true"
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-traefik-forward-auth@kubernetescrd
            hosts:
            - grafana.leetserve.com
            - localhost
            tls:
            - hosts:
              - grafana.leetserve.com
              secretName: grafana-tls
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
              - name: 'default'
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              loki-monitoring:
                gnetId: 14055
                revision: 5
                datasource: Loki
              loki:
                gnetId: 15141
                revision: 1
                datasource: Loki
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Replace=true
