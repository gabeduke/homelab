apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prom-stack
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "46.4.1"  # Check for updates: helm search repo prometheus-community/kube-prometheus-stack --versions
    helm:
      values: |-
        kube-state-metrics:
          image:
            registry: docker.io
            repository: dukeman/kube-state-metrics
            tag: v2.9.2
          # Resource limits for kube-state-metrics
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
        prometheusOperator:
          admissionWebhooks:
            certManager:
              enabled: true
          # Resource limits for Prometheus Operator
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
        # Disable problematic default rules that are too expensive for home lab
        # These apiserver rules use 30d lookback windows causing timeouts
        defaultRules:
          rules:
            kubeApiserverAvailability: false  # Disable kube-apiserver-availability rules
            kubeApiserverBurnrate: false     # Disable kube-apiserver-burnrate rules
        prometheus:
          prometheusSpec:
            retention: 7d  # Reduced from default 10d to save space
            retentionSize: 6GiB  # Must stay well UNDER the volume size (10Gi) - it was
                       # previously 5GiB on a 5Gi volume, i.e. 100%, so Prometheus
                       # filled the disk before retention ever triggered and
                       # crashlooped on 'no space left on device'.
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            # Resource limits for Prometheus (critical for Raspberry Pi)
            # Increased CPU request to reduce throttling that causes rule evaluation failures
            # PrometheusRuleFailures and PrometheusMissingRuleEvaluations are often caused by CPU throttling
            resources:
              requests:
                memory: 512Mi
                cpu: 500m  # Increased from 200m to reduce CPU throttling on Raspberry Pi
              limits:
                memory: 2Gi  # Prometheus can be memory-hungry, but cap it
                cpu: 1500m  # Increased from 1000m to allow more headroom for rule evaluation
            # Rule evaluation configuration - optimized for home lab / small clusters
            # Prevents PrometheusRuleFailures and PrometheusMissingRuleEvaluations alerts
            evaluationInterval: 60s  # Increased from 30s to reduce evaluation pressure
            # Reduce scrape load to help with rule evaluation performance
            # Global scrape interval (default is 15s, increasing to 30s reduces load)
            scrapeInterval: 30s
            scrapeTimeout: 10s  # Timeout for scrapes (default is 10s)
            # Note: Kubelet ServiceMonitor already has metric relabeling configured by the chart
            # to drop high-cardinality container metrics (fs, cpu throttling, memory swap, etc.)
            # Alerting configuration
            alerting:
              alertmanagers:
                - namespace: monitoring
                  name: prom-stack-kube-prometheus-alertmanager
                  port: http-web
            # ServiceMonitor discovery configuration
            # Allow Prometheus to discover ServiceMonitors from all namespaces
            # By default, Prometheus only discovers ServiceMonitors in its own namespace
            serviceMonitorNamespaceSelector: {}  # Empty selector matches all namespaces
            # Allow Prometheus to discover ServiceMonitors without requiring release label
            # By default, kube-prometheus-stack only selects ServiceMonitors with release: prom-stack
            serviceMonitorSelector: {}  # Empty selector matches all ServiceMonitors
            # Alternative: To select specific namespaces by label, use:
            # serviceMonitorNamespaceSelector:
            #   matchLabels:
            #     monitoring: enabled
            # Or to select specific namespaces by name, you would need to label the namespaces
            # and use matchLabels, or use a different approach
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              kubernetes.io/ingress.class: traefik
              ingress.kubernetes.io/ssl-redirect: "true"
              cert-manager.io/cluster-issuer: letsencrypt-aws-prod
              traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-traefik-forward-auth@kubernetescrd
            hosts:
              - prometheus.leetserve.com
            paths:
              - /
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.leetserve.com
        alertmanager:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              kubernetes.io/ingress.class: traefik
              ingress.kubernetes.io/ssl-redirect: "true"
              cert-manager.io/cluster-issuer: letsencrypt-aws-prod
              traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-traefik-forward-auth@kubernetescrd
            hosts:
              - alertmanager.leetserve.com
            paths:
              - /
            tls:
              - secretName: alertmanager-tls
                hosts:
                  - alertmanager.leetserve.com
          alertmanagerSpec:
            retention: 120h  # 5 days - keep alerts for investigation
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 1Gi  # AlertManager needs less storage
            # Resource limits for AlertManager
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 128Mi
                cpu: 100m
            # Alert routing is configured via AlertmanagerConfig CRD
            # See: clusters/iot/namespace-monitoring/alertmanager-config.yaml
            # This allows better secret management and configuration
        prometheus-node-exporter:
          tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.leetserve.com/mothership"
            operator: "Exists"
            effect: "NoSchedule"
        installCRDs: false
        grafana:
          admin:
            existingSecret: grafana-credentials
          rbac:
            pspEnabled: false
          # Resource limits for Grafana
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          plugins: []
          datasources:
            enabled: true
            label: grafana_datasource
            searchNamespace: ALL
            uid: prometheus
            url: http://prom-stack-kube-prometheus-prometheus.monitoring.svc:9090
          sidecar:
            datasources:
              enabled: true
              label: grafana_datasource
              searchNamespace: ALL
              uid: prometheus
              url: http://prom-stack-kube-prometheus-prometheus.monitoring.svc:9090
            dashboards:
              enabled: true
              label: grafana_dashboard
              searchNamespace: ALL
            notifiers:
              enabled: true
              label: grafana_notifiers
              searchNamespace: ALL
          service:
            annotations:
              external-dns.alpha.kubernetes.io/hostname: grafana.leetserve.com
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              kubernetes.io/ingress.class: traefik
              ingress.kubernetes.io/ssl-redirect: "true"
              cert-manager.io/cluster-issuer: letsencrypt-aws-prod
              traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-traefik-forward-auth@kubernetescrd
            hosts:
            - grafana.leetserve.com
            - localhost
            tls:
            - hosts:
              - grafana.leetserve.com
              secretName: grafana-tls
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
              - name: 'default'
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              loki-monitoring:
                gnetId: 14055
                revision: 5
                datasource: Loki
              loki:
                gnetId: 15141
                revision: 1
                datasource: Loki
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Replace=true
