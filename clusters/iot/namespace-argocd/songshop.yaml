apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: songshop
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: songshop
    server: https://kubernetes.default.svc
  source:
    # Private repo: ArgoCD reads it with the deploy key in the argocd/repo-songshop
    # Secret, generated from secrets/songshop-deploy-key by the root kustomization.
    repoURL: git@github.com:gabeduke/songshop.git
    path: deploy/prod
    targetRevision: main
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
