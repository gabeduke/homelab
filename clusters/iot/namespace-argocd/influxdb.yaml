apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: influxdb
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: influxdb
    server: https://kubernetes.default.svc
  source:
    repoURL: 'https://helm.influxdata.com/'
    targetRevision: "2.1.1"
    chart: influxdb2
    helm:
      values: |-
        image:
          tag: 2.7.1-alpine
        persistence:
          enabled: false  # Idle service, not causing issues
        # Resource limits for InfluxDB (idle service, keep minimal)
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
        env:
          - name: INFLUXDB_DB
            value: home
        adminUser:
          organization: leetserve
          bucket: home
          user: gabeduke
          existingSecret: influxdb-auth
        ingress:
          enabled: true
          ingressClassName: traefik
          tls: true
          secretName: influxdb-tls
          hostname: influxdb.leetserve.com
          annotations:
            kubernetes.io/ingress.class: traefik
            ingress.kubernetes.io/ssl-redirect: "true"
            cert-manager.io/cluster-issuer: letsencrypt-aws-prod
            traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-traefik-forward-auth@kubernetescrd
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
