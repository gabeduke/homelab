apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd
resources:
# Pinned to a release tag, NOT "stable".
# "stable" floats: every `make iot` pulled whatever upstream stable was that day,
# silently drifting the cluster's ArgoCD version. Bump this deliberately.
- https://raw.githubusercontent.com/argoproj/argo-cd/v3.2.1/manifests/install.yaml
- argocd-ingress.yaml
# - minecraft.yaml
- cert-manager.yaml
- external-dns.yaml
# - gift-wiki.yaml
# - gift-wiki-dev.yaml
- influxdb.yaml
# - loki.yaml
- mosquitto.yaml
- prom-stack.yaml
# - reap.yaml
patches:
- target:
    kind: ConfigMap
    name: argocd-cmd-params-cm
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: argocd-cmd-params-cm
    data:
      server.insecure: "true"
- target:
    kind: ConfigMap
    name: argocd-cm
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: argocd-cm
    data:
      admin.enabled: "true"
      policy.default: "role:readonly"
